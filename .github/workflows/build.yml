name: Gerar APK

on:
  push:
    paths:
      - 'projeto.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descompactar projeto
        run: |
          mkdir proj
          unzip -q projeto.zip -d proj

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar
        working-directory: proj
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renomear APK
        run: cp proj/app/build/outputs/apk/debug/app-debug.apk TradutorManga.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Tradutor Manga v${{ github.run_number }}
          files: TradutorManga.apk
